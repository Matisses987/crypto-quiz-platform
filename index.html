    typeof input.bankVersion === "string" && input.bankVersion.length > 0
      ? input.bankVersion
      : typeof meta.bankVersion === "string" && meta.bankVersion.length > 0
        ? meta.bankVersion
        : records.length > 0 && typeof records[0].bankVersion === "string"
          ? records[0].bankVersion
          : "unknown";

  return {
    kind: cn_EXPORT_KIND,
    schemaVersion: cn_EXPORT_SCHEMA_VERSION,
    appVersion: cn_VERSION,
    bankVersion,
    exportedAt: nowISO,
    exportedBy: { nickname, deviceId: typeof meta.deviceId === "string" ? meta.deviceId : "d-00000000" },
    range: { scope, from: scope === "all" ? null : from, to: scope === "all" ? null : scope === "day" ? from : to },
    counts: {
      records: records.length,
      sessions: sessions.length,
      overrides: Object.keys(overrides.items).length,
    },
    records,
    mockSessions: sessions,
    overrides,
  };
}

// CQP.rescueExport({raw, bankVersion, nowISO, reason, detectedSchemaVersion}) -> 抢救导出 payload
// t41 F-03：本地 meta.schemaVersion 不兼容 / 数据 JSON 损坏时，应用进入只读阻断态（不写盘），
// 导出入口改为用 CQP.storage.readRaw() 的原样字符串在这里组装文件：
//   · 能解析的键 → 结构化导出（records / mockSessions / overrides / 昵称 / deviceId）；
//   · 解析不了的键 → 以**原始字符串**放进 rescue.rawKeys，保证用户能手工抢救；
//   · schemaVersion 用磁盘上检测到的值（而不是当前版本），避免这份文件被误当成正常备份。
function io_rescueExport(input) {
  const opts = io_isPlainObject(input) ? input : {};
  const raw = io_isPlainObject(opts.raw) ? opts.raw : {};
  const nowISO = typeof opts.nowISO === "string" ? opts.nowISO : tm_isoNow();
  const parsed = {};
  const unparsable = [];
  const rawKeys = {};
  for (const key of Object.keys(raw)) {
    const text = raw[key];
    if (text === null || text === undefined || text === "") continue;
    try {
      parsed[key] = JSON.parse(text);
    } catch (err) {
      unparsable.push(key);
      rawKeys[key] = String(text);
    }
  }
  const meta = io_isPlainObject(parsed[cn_STORAGE_KEYS.meta]) ? parsed[cn_STORAGE_KEYS.meta] : {};
  const records = Array.isArray(parsed[cn_STORAGE_KEYS.records]) ? parsed[cn_STORAGE_KEYS.records] : [];
  const sessions = Array.isArray(parsed[cn_STORAGE_KEYS.sessions]) ? parsed[cn_STORAGE_KEYS.sessions] : [];
  const overrides = io_isPlainObject(parsed[cn_STORAGE_KEYS.overrides])
    ? parsed[cn_STORAGE_KEYS.overrides]
    : { schemaVersion: cn_STORE_SCHEMA_VERSION, items: {} };
  const overlayItems = io_isPlainObject(overrides.items) ? overrides.items : {};
  const detected =
    typeof opts.detectedSchemaVersion === "string" && opts.detectedSchemaVersion.length > 0
      ? opts.detectedSchemaVersion
      : typeof meta.schemaVersion === "string" && meta.schemaVersion.length > 0
        ? meta.schemaVersion
        : "unknown";
  const nickname = typeof meta.nickname === "string" ? io_sanitizeNickname(meta.nickname) : "";
  return {
    kind: cn_EXPORT_KIND,
    schemaVersion: detected,
    appVersion: cn_VERSION,
    bankVersion: typeof opts.bankVersion === "string" && opts.bankVersion.length > 0 ? opts.bankVersion : "unknown",
    exportedAt: nowISO,
    rescue: {
      blocked: true,
      reason: typeof opts.reason === "string" && opts.reason.length > 0 ? opts.reason : "E_VERSION",
      note: "只读抢救导出：本次运行没有写入任何数据；本文件由浏览器本地存储（cqp.v1.*）的原始内容直接生成。",
      detectedSchemaVersion: detected,
      unparsableKeys: unparsable,
      rawKeys,
    },
    exportedBy: { nickname: nickname.length > 0 ? nickname : "未命名", deviceId: typeof meta.deviceId === "string" ? meta.deviceId : "d-00000000" },
    range: { scope: "all", from: null, to: null },
    counts: { records: records.length, sessions: sessions.length, overrides: Object.keys(overlayItems).length },
    records,
    mockSessions: sessions,
    overrides,
  };
}

function io_isPlainObject(value) {
  return !!value && typeof value === "object" && !Array.isArray(value);
}

// CQP.validateImport(textOrObject) -> {ok, errors, warnings, payload?}
function io_validateImport(textOrObject) {
  const errors = [];
  const warnings = [];
  let obj = null;
  if (typeof textOrObject === "string") {
    if (textOrObject.trim().length === 0) {
      errors.push({ code: "E_PARSE", message: "文件不是合法 JSON" });
      return { ok: false, errors, warnings };
    }
    try {
      obj = JSON.parse(textOrObject);
    } catch (err) {
      errors.push({ code: "E_PARSE", message: "文件不是合法 JSON" });
      return { ok: false, errors, warnings };
    }
  } else if (io_isPlainObject(textOrObject)) {
    obj = textOrObject;
  } else {
    errors.push({ code: "E_PARSE", message: "文件不是合法 JSON" });
    return { ok: false, errors, warnings };
  }

  if (!io_isPlainObject(obj) || obj.kind !== cn_EXPORT_KIND) {
    errors.push({ code: "E_KIND", message: "不是本平台的导出文件" });
    return { ok: false, errors, warnings };
  }
  const schemaVersion = obj.schemaVersion;
  if (typeof schemaVersion !== "string" || schemaVersion.split(".")[0] !== "1") {
    errors.push({
      code: "E_VERSION",
      message: "数据版本不兼容（发现 " + String(schemaVersion) + "，程序支持 " + cn_EXPORT_SCHEMA_VERSION + "）",
    });
    return { ok: false, errors, warnings };
  }

  const missing = [];
  const needString = (path, value) => {
    if (typeof value !== "string" || value.length === 0) missing.push(path);
  };
  needString("appVersion", obj.appVersion);
  needString("bankVersion", obj.bankVersion);
  needString("exportedAt", obj.exportedAt);
  if (!io_isPlainObject(obj.exportedBy)) missing.push("exportedBy");
  else needString("exportedBy.nickname", obj.exportedBy.nickname);
  if (!io_isPlainObject(obj.range)) missing.push("range");
  else {
    if (obj.range.scope !== "day" && obj.range.scope !== "range" && obj.range.scope !== "all") missing.push("range.scope");
    for (const key of ["from", "to"]) {
      if (!(key in obj.range)) missing.push("range." + key);
      else if (obj.range[key] !== null && typeof obj.range[key] !== "string") missing.push("range." + key);
    }
  }
  if (!io_isPlainObject(obj.counts)) missing.push("counts");
  else {
    for (const key of ["records", "sessions", "overrides"]) {
      if (!Number.isInteger(obj.counts[key])) missing.push("counts." + key);
    }
  }
  if (!Array.isArray(obj.records)) missing.push("records");
  if (!Array.isArray(obj.mockSessions)) missing.push("mockSessions");
  if (!io_isPlainObject(obj.overrides)) missing.push("overrides");
  else if (!io_isPlainObject(obj.overrides.items)) missing.push("overrides.items");
  if (missing.length > 0) {
    errors.push({ code: "E_SCHEMA", message: "导出文件缺少必填字段或类型不符：" + missing.join(", ") });
    return { ok: false, errors, warnings };
  }

  const counts = obj.counts;
  const countMismatch = [];
  if (counts.records !== obj.records.length) countMismatch.push("records");
  if (counts.sessions !== obj.mockSessions.length) countMismatch.push("sessions");
  if (counts.overrides !== Object.keys(obj.overrides.items).length) countMismatch.push("overrides");
  if (countMismatch.length > 0) {
    errors.push({ code: "E_COUNTS", message: "文件已损坏（计数不一致）：" + countMismatch.join(", ") });
    return { ok: false, errors, warnings };
  }

  return { ok: true, errors, warnings, payload: obj };
}

function io_checkRecordShape(record) {
  if (!io_isPlainObject(record)) return "bad_record";
  if (typeof record.qid !== "string" || !io_QID_RE.test(record.qid)) return "bad_qid";
  if (typeof record.ts !== "string" || !io_ISO_RE.test(record.ts)) return "bad_ts";
  if (!Array.isArray(record.myAnswer) || record.myAnswer.some((x) => typeof x !== "string")) return "bad_myAnswer";
  if (record.confidence !== "confident" && record.confidence !== "guessed") return "bad_confidence";
  if (typeof record.correct !== "boolean") return "bad_correct";
  return null;
}

function io_cloneStore(store) {
  return JSON.parse(JSON.stringify(store));
}

function io_compareUpdatedAt(a, b) {
  const x = typeof a === "string" ? a : "";
  const y = typeof b === "string" ? b : "";
  if (x === y) return 0;
  return x > y ? 1 : -1;
}

function io_normalizeOverrideItem(item) {
  const src = io_isPlainObject(item) ? item : {};
  return {
    answer: Array.isArray(src.answer) && src.answer.length >= 1 ? src.answer.filter((x) => typeof x === "string") : null,
    tags: null,
    difficulty: src.difficulty === 1 || src.difficulty === 2 || src.difficulty === 3 ? src.difficulty : null,
    flagged: src.flagged === true,
    note: typeof src.note === "string" ? src.note.slice(0, 200) : "",
    updatedAt: typeof src.updatedAt === "string" ? src.updatedAt : tm_isoNow(),
    updatedBy: typeof src.updatedBy === "string" ? src.updatedBy : "",
    rev: Number.isInteger(src.rev) && src.rev >= 1 ? src.rev : 1,
  };
}

// CQP.mergeImport({store, payload, nowISO?, fileName?, questions?, bankVersion?}) -> {store, report}
function io_mergeImport(input) {
  if (!input || typeof input !== "object") throw new TypeError("mergeImport(input): input must be an object");
  const store = input.store;
  if (!store || typeof store !== "object") throw new TypeError("mergeImport(input): input.store must be an object");
  const payload = input.payload;
  if (!io_isPlainObject(payload)) throw new TypeError("mergeImport(input): input.payload must be an object");
  if (payload.kind !== cn_EXPORT_KIND) {
    throw new TypeError('mergeImport(input): input.payload.kind must be "' + cn_EXPORT_KIND + '"');
  }
  const nowISO = input.nowISO === undefined || input.nowISO === null ? tm_isoNow() : input.nowISO;
  const next = io_cloneStore(store);
  if (!Array.isArray(next.records)) next.records = [];
  if (!io_isPlainObject(next.wrongbook)) next.wrongbook = {};
  if (!Array.isArray(next.sessions)) next.sessions = [];
  if (!Array.isArray(next.imports)) next.imports = [];
  if (!io_isPlainObject(next.overrides)) next.overrides = { schemaVersion: cn_STORE_SCHEMA_VERSION, items: {} };
  if (!io_isPlainObject(next.overrides.items)) next.overrides.items = {};

  const report = {
    ok: true,
    importedRecords: 0,
    duplicates: 0,
    duplicatesInFile: 0,
    skipped: [],
    repaired: [],
    unknownQids: [],
    versionMismatch: [],
    overridesApplied: 0,
    overridesKept: 0,
    sessionsImported: 0,
    nicknames: [],
    errors: [],
  };

  const bank = Array.isArray(input.questions)
    ? { questions: input.questions }
    : io_registeredBank && Array.isArray(io_registeredBank.questions)
      ? io_registeredBank
      : null;
  const knownIds = bank ? new Set(bank.questions.map((q) => q.id)) : null;
  const currentBankVersion = typeof input.bankVersion === "string" ? input.bankVersion : bank ? bank.bankVersion : null;

  const localKeys = new Set();
  for (const r of next.records) {
    try {
      localKeys.add(rc_recordKey(r));
    } catch (err) {
      if (r && typeof r.qid === "string" && typeof r.nickname === "string" && typeof r.ts === "string") {
        localKeys.add(r.nickname + "\u0001" + r.qid + "\u0001" + r.ts);
      }
    }
  }
  const fileKeys = new Set();
  const incoming = [];
  const importedRecordsList = payload.records;
  for (const raw of importedRecordsList) {
    const reason = io_checkRecordShape(raw);
    if (reason) {
      report.skipped.push({ reason, raw: JSON.stringify(raw).slice(0, 300) });
      continue;
    }
    const key = raw.nickname + "\u0001" + raw.qid + "\u0001" + raw.ts;
    if (fileKeys.has(key)) {
      report.duplicatesInFile += 1;
      continue;
    }
    fileKeys.add(key);
    let localDate = raw.localDate;
    const recomputed = tm_localDateOf(raw.ts);
    if (localDate !== recomputed) {
      report.repaired.push({ qid: raw.qid, ts: raw.ts, from: typeof localDate === "string" ? localDate : null, to: recomputed });
      localDate = recomputed;
    }
    if (knownIds && !knownIds.has(raw.qid)) {
      report.unknownQids.push({ qid: raw.qid, nickname: raw.nickname, ts: raw.ts });
      continue;
    }
    if (currentBankVersion && typeof raw.bankVersion === "string" && raw.bankVersion !== currentBankVersion) {
      report.versionMismatch.push({ qid: raw.qid, bankVersion: raw.bankVersion });
    }
    if (localKeys.has(key)) {
      report.duplicates += 1;
      continue;
    }
    const record = {
      recordKey: key,
      qid: raw.qid,
      nickname: raw.nickname,
      ts: raw.ts,
      localDate,
      mode: cn_TYPES.indexOf(raw.mode) >= 0 ? raw.mode : typeof raw.mode === "string" ? raw.mode : "practice_random",
      sessionId: typeof raw.sessionId === "string" ? raw.sessionId : null,
      myAnswer: raw.myAnswer.slice(),
      correct: raw.correct,
      confidence: raw.confidence,
      color: raw.color === "green" || raw.color === "yellow" || raw.color === "red" ? raw.color : raw.correct ? (raw.confidence === "guessed" ? "yellow" : "green") : "red",
      elapsedMs: Number.isFinite(raw.elapsedMs) && raw.elapsedMs >= 0 ? Math.round(raw.elapsedMs) : 0,
      bankVersion: typeof raw.bankVersion === "string" ? raw.bankVersion : "unknown",
      appVersion: typeof raw.appVersion === "string" ? raw.appVersion : cn_VERSION,
    };
    incoming.push(record);
    report.importedRecords += 1;
  }

  incoming.sort((a, b) => (a.ts === b.ts ? 0 : a.ts < b.ts ? -1 : 1));
  next.records = next.records.concat(incoming);

  // 覆盖层合并：last-write-wins（updatedAt 较新者胜；相同则 updatedBy 字典序较大者胜）
  const incomingOverrides = io_isPlainObject(payload.overrides) && io_isPlainObject(payload.overrides.items) ? payload.overrides.items : {};
  const mergedItems = {};
  for (const key of Object.keys(next.overrides.items)) mergedItems[key] = next.overrides.items[key];
  for (const qid of Object.keys(incomingOverrides)) {
    const item = io_normalizeOverrideItem(incomingOverrides[qid]);
    const local = mergedItems[qid];
    if (!io_isPlainObject(local)) {
      mergedItems[qid] = item;
      report.overridesApplied += 1;
      continue;
    }
    const cmp = io_compareUpdatedAt(item.updatedAt, local.updatedAt);
    if (cmp > 0) {
      mergedItems[qid] = item;
      report.overridesApplied += 1;
    } else if (cmp < 0) {
      report.overridesKept += 1;
    } else if (item.updatedBy > (typeof local.updatedBy === "string" ? local.updatedBy : "")) {
      mergedItems[qid] = item;
      report.overridesApplied += 1;
    } else {
      report.overridesKept += 1;
    }
  }
  next.overrides = { schemaVersion: cn_STORE_SCHEMA_VERSION, items: mergedItems };

  // 模拟赛合并：按 sessionId 去重，已存在不覆盖
  const existingSessions = new Set();
  for (const s of next.sessions) if (s && typeof s.sessionId === "string") existingSessions.add(s.sessionId);
  const incomingSessions = Array.isArray(payload.mockSessions) ? payload.mockSessions : [];
  for (const s of incomingSessions) {
    if (!io_isPlainObject(s) || typeof s.sessionId !== "string") continue;
    if (existingSessions.has(s.sessionId)) continue;
    existingSessions.add(s.sessionId);
    next.sessions.push(s);
    report.sessionsImported += 1;
  }

  const nickSet = new Set();
  for (const r of incoming) nickSet.add(r.nickname);
  report.nicknames = Array.from(nickSet).sort((a, b) => a.localeCompare(b, "zh-Hans-CN"));

  if (typeof input.fileName === "string" && input.fileName.length > 0) {
    next.imports.push({
      fileName: input.fileName,
      importedAt: nowISO,
      nicknames: report.nicknames,
      importedRecords: report.importedRecords,
      duplicates: report.duplicates + report.duplicatesInFile,
      skipped: report.skipped.length,
    });
  }

  if (next.meta && typeof next.meta === "object") next.meta.updatedAt = nowISO;
  return { store: next, report };
}

// ===== src/core/stats.mjs =====
// 个人统计与团队统计（docs/需求规格.md 8.5 / 8.6 / 9.12）

function st_compareNickname(a, b) {
  const x = typeof a === "string" ? a : "";
  const y = typeof b === "string" ? b : "";
  try {
    const r = x.localeCompare(y, "zh-Hans-CN");
    if (r !== 0) return r < 0 ? -1 : 1;
  } catch (err) {
    /* 无 ICU 时退化为码点比较 */
  }
  return x < y ? -1 : x > y ? 1 : 0;
}

function st_indexQuestions(questions) {
  const map = new Map();
  for (const q of questions) if (q && typeof q.id === "string") map.set(q.id, q);
  return map;
}

function st_emptyGroup() {
  return { answered: 0, correct: 0, accuracy: null, mastery: { attempts: 0, index: null, insufficient: true } };
}

function st_recordsOf(records, nickname) {
  return records.filter((r) => r && r.nickname === nickname);
}

// 个人易错题（8.6）：判错过至少 1 次
function st_personalWrongQuestions(mine, qById) {
  const byQid = new Map();
  for (const r of mine) {
    let row = byQid.get(r.qid);
    if (!row) {
      row = { qid: r.qid, wrongCount: 0, correctCount: 0, guessedCorrect: 0, lastWrongAt: null, attempts: [] };
      byQid.set(r.qid, row);
    }
    row.attempts.push(r);
    if (r.correct) {
      row.correctCount += 1;
      if (r.confidence === "guessed") row.guessedCorrect += 1;
    } else {
      row.wrongCount += 1;
      if (row.lastWrongAt === null || r.ts > row.lastWrongAt) row.lastWrongAt = r.ts;
    }
  }
  const rows = [];
  for (const row of byQid.values()) {
    if (row.wrongCount < 1) continue;
    const m = ms_masteryOfAttempts(row.attempts);
    rows.push({
      qid: row.qid,
      question: qById.get(row.qid) || null,
      wrongCount: row.wrongCount,
      correctCount: row.correctCount,
      guessedCorrect: row.guessedCorrect,
      lastWrongAt: row.lastWrongAt,
      masteryIndex: m.index,
      insufficient: m.insufficient,
      attempts: m.attempts,
    });
  }
  rows.sort((a, b) => {
    if (b.wrongCount !== a.wrongCount) return b.wrongCount - a.wrongCount;
    if (b.guessedCorrect !== a.guessedCorrect) return b.guessedCorrect - a.guessedCorrect;
    const at = a.lastWrongAt || "";
    const bt = b.lastWrongAt || "";
    if (at !== bt) return at < bt ? 1 : -1;
    return a.qid < b.qid ? -1 : 1;
  });
  return rows;
}

function st_mockStats(sessions, nickname) {
  let best = null;
  let count = 0;
  for (const s of sessions) {
    if (!s || s.nickname !== nickname || !s.result) continue;
    count += 1;
    const score = typeof s.result.score === "number" ? s.result.score : 0;
    if (best === null || score > best) best = score;
  }
  return { mockBest: best, mockCount: count };
}

// CQP.personalStats({records, questions, nickname, sessions?})
function st_personalStats(input) {
  if (!input || typeof input !== "object") throw new TypeError("personalStats(input): input must be an object");
  const { records, questions, nickname } = input;
  if (!Array.isArray(records)) throw new TypeError("personalStats(input): input.records must be an array");
  if (!Array.isArray(questions)) throw new TypeError("personalStats(input): input.questions must be an array");
  if (typeof nickname !== "string" || nickname.length === 0) {
    throw new TypeError("personalStats(input): input.nickname must be a non-empty string");
  }
  const sessions = Array.isArray(input.sessions) ? input.sessions : [];
  const qById = st_indexQuestions(questions);
  const mine = st_recordsOf(records, nickname);
  let correct = 0;
  let wrong = 0;
  let guessedCorrect = 0;
  let confidentCorrect = 0;
  for (const r of mine) {
    if (r.correct) {
      correct += 1;
      if (r.confidence === "guessed") guessedCorrect += 1;
      else confidentCorrect += 1;
    } else {
      wrong += 1;
    }
  }
  const mastery = ms_masteryOfAttempts(mine);
  const byType = ms_groupSummary(mine, questions, (q) => q.sectionType);
  for (const t of cn_TYPES) if (!byType[t]) byType[t] = st_emptyGroup();
  const byChapter = ms_groupSummary(mine, questions, (q) => q.chapterCode);
  for (const c of cn_CHAPTER_CODES) if (!byChapter[c]) byChapter[c] = st_emptyGroup();
  const wrongQuestions = st_personalWrongQuestions(mine, qById);
  const mock = st_mockStats(sessions, nickname);
  return {
    nickname,
    answered: mine.length,
    correct,
    wrong,
    guessedCorrect,
    confidentCorrect,
    accuracy: mine.length === 0 ? null : ms_round1((correct / mine.length) * 100),
    mastery: { attempts: mastery.attempts, index: mastery.index, insufficient: mastery.insufficient },
    byType,
    byChapter,
    wrongQuestions,
    wrongQuestionCount: wrongQuestions.length,
    mockBest: mock.mockBest,
    mockCount: mock.mockCount,
  };
}

// CQP.teamStats({records, questions, minWrongUsers?, sessions?})
function st_teamStats(input) {
  if (!input || typeof input !== "object") throw new TypeError("teamStats(input): input must be an object");
  const { records, questions } = input;
  if (!Array.isArray(records)) throw new TypeError("teamStats(input): input.records must be an array");
  if (!Array.isArray(questions)) throw new TypeError("teamStats(input): input.questions must be an array");
  const minWrongUsers = Number.isInteger(input.minWrongUsers) ? input.minWrongUsers : cn_WRONG_THRESHOLD_USERS;
  const sessions = Array.isArray(input.sessions) ? input.sessions : [];
  const qById = st_indexQuestions(questions);

  const agg = new Map();
  const nickSet = new Set();
  for (const r of records) {
    if (!r || typeof r.qid !== "string" || typeof r.nickname !== "string" || r.nickname.length === 0) continue;
    nickSet.add(r.nickname);
    let row = agg.get(r.qid);
    if (!row) {
      row = {
        qid: r.qid,
        answeredUsers: new Set(),
        wrongUsers: new Map(),
        wrongCount: 0,
        correctCount: 0,
        guessedCorrect: 0,
        attempts: [],
        lastWrongAt: null,
      };
      agg.set(r.qid, row);
    }
    row.answeredUsers.add(r.nickname);
    row.attempts.push(r);
    if (r.correct) {
      row.correctCount += 1;
      if (r.confidence === "guessed") row.guessedCorrect += 1;
    } else {
      row.wrongCount += 1;
      row.wrongUsers.set(r.nickname, (row.wrongUsers.get(r.nickname) || 0) + 1);
      if (row.lastWrongAt === null || r.ts > row.lastWrongAt) row.lastWrongAt = r.ts;
    }
  }

  const teamWrongQuestions = [];
  for (const row of agg.values()) {
    const wrongUsers = row.wrongUsers.size;
    if (wrongUsers < minWrongUsers) continue;
    const m = ms_masteryOfAttempts(row.attempts);
    const answeredUsers = row.answeredUsers.size;
    teamWrongQuestions.push({
      qid: row.qid,
      question: qById.get(row.qid) || null,
      wrongUsers,
      wrongUserNames: Array.from(row.wrongUsers.keys()).sort(st_compareNickname),
      wrongCount: row.wrongCount,
      answeredUsers,
      correctCount: row.correctCount,
      guessedCorrect: row.guessedCorrect,
      wrongRate: answeredUsers === 0 ? null : ms_round1((wrongUsers / answeredUsers) * 100),
      lastWrongAt: row.lastWrongAt,
      teamMasteryIndex: m.index,
      insufficient: m.insufficient,
      attempts: m.attempts,
    });
  }
  teamWrongQuestions.sort((a, b) => {
    if (b.wrongUsers !== a.wrongUsers) return b.wrongUsers - a.wrongUsers;
    if (b.wrongCount !== a.wrongCount) return b.wrongCount - a.wrongCount;
    return a.qid < b.qid ? -1 : a.qid > b.qid ? 1 : 0;
  });

  const nicknames = Array.from(nickSet).sort(st_compareNickname);
  const members = nicknames.map((nickname) => {
    const p = st_personalStats({ records, questions, nickname, sessions });
    return {
      nickname,
      answered: p.answered,
      correct: p.correct,
      wrong: p.wrong,
      guessedCorrect: p.guessedCorrect,
      confidentCorrect: p.confidentCorrect,
      accuracy: p.accuracy,
      mastery: p.mastery,
      wrongQuestionCount: p.wrongQuestionCount,
      mockBest: p.mockBest,
      mockCount: p.mockCount,
    };
  });

  const matrix = teamWrongQuestions.map((row) => {
    const cells = nicknames.map((nickname) => {
      const list = records.filter((r) => r && r.qid === row.qid && r.nickname === nickname);
      let cell = "未做";
      if (list.length > 0) {
        const hasWrong = list.some((r) => !r.correct);
        if (hasWrong) cell = "错";
        else if (list.some((r) => r.confidence === "guessed")) cell = "猜对";
        else cell = "对";
      }
      return { nickname, cell, attempts: list.length };
    });
    return { qid: row.qid, question: row.question, cells };
  });

  const teamMastery = ms_masteryOfAttempts(records.filter((r) => r && typeof r.qid === "string" && typeof r.nickname === "string"));

  return {
    teamWrongQuestions,
    members,
    matrix,
    nicknames,
    teamMastery: { attempts: teamMastery.attempts, index: teamMastery.index, insufficient: teamMastery.insufficient },
    totalRecords: records.length,
    minWrongUsers,
  };
}

// ===== src/core/store.mjs =====
// Store 形状、内存态与迁移（docs/需求规格.md 6.1 / 6.6 / 9.13）

function sr_emptyStore() {
  return {
    meta: {
      schemaVersion: cn_STORE_SCHEMA_VERSION,
      appVersion: cn_VERSION,
      nickname: "",
      deviceId: "",
      createdAt: null,
      updatedAt: null,
    },
    records: [],
    wrongbook: {},
    overrides: { schemaVersion: cn_STORE_SCHEMA_VERSION, items: {} },
    sessions: [],
    imports: [],
  };
}

function sr_newDeviceId() {
  const g = typeof globalThis !== "undefined" ? globalThis : {};
  let hex = "";
  if (g.crypto && typeof g.crypto.getRandomValues === "function") {
    const buf = new Uint8Array(4);
    g.crypto.getRandomValues(buf);
    for (const b of buf) hex += b.toString(16).padStart(2, "0");
  } else {
    for (let i = 0; i < 4; i += 1) hex += Math.floor(Math.random() * 256).toString(16).padStart(2, "0");
  }
  return "d-" + hex;
}

function sr_isObject(value) {
  return !!value && typeof value === "object" && !Array.isArray(value);
}

// CQP.migrateStore(raw) -> {store, migrated, error?}
function sr_migrateStore(raw) {
  const empty = sr_emptyStore();
  if (raw === null || raw === undefined) return { store: empty, migrated: false };
  if (!sr_isObject(raw)) return { store: empty, migrated: false, error: { code: "E_STORE_SHAPE" } };
  const rawMeta = sr_isObject(raw.meta) ? raw.meta : null;
  if (rawMeta && typeof rawMeta.schemaVersion === "string" && rawMeta.schemaVersion.split(".")[0] !== "1") {
    return { store: sr_emptyStore(), migrated: false, error: { code: "E_VERSION" } };
  }

  const store = sr_emptyStore();
  let migrated = false;
  const meta = store.meta;
  if (rawMeta) {
    if (typeof rawMeta.schemaVersion === "string") meta.schemaVersion = rawMeta.schemaVersion;
    if (typeof rawMeta.appVersion === "string") meta.appVersion = rawMeta.appVersion;
    if (typeof rawMeta.nickname === "string") meta.nickname = rawMeta.nickname.slice(0, 20);
    if (typeof rawMeta.deviceId === "string") meta.deviceId = rawMeta.deviceId;
    if (typeof rawMeta.createdAt === "string") meta.createdAt = rawMeta.createdAt;
    if (typeof rawMeta.updatedAt === "string") meta.updatedAt = rawMeta.updatedAt;
    if (typeof rawMeta.schemaVersion !== "string" || typeof rawMeta.nickname !== "string") migrated = true;
  } else {
    migrated = true;
  }

  store.records = Array.isArray(raw.records) ? raw.records.filter((r) => sr_isObject(r)) : [];
  if (!Array.isArray(raw.records)) migrated = true;

  store.wrongbook = sr_isObject(raw.wrongbook) ? raw.wrongbook : {};
  for (const qid of Object.keys(store.wrongbook)) {
    const entry = store.wrongbook[qid];
    if (!sr_isObject(entry)) {
      delete store.wrongbook[qid];
      migrated = true;
      continue;
    }
    if (entry.state !== "active" && entry.state !== "removed") {
      entry.state = "active";
      migrated = true;
    }
    if (typeof entry.confidentStreak !== "number") entry.confidentStreak = 0;
    if (typeof entry.attemptsSinceAdd !== "number") entry.attemptsSinceAdd = 0;
    if (typeof entry.correctSinceAdd !== "number") entry.correctSinceAdd = 0;
  }

  if (sr_isObject(raw.overrides) && sr_isObject(raw.overrides.items)) {
    store.overrides.items = raw.overrides.items;
    for (const qid of Object.keys(store.overrides.items)) {
      const item = store.overrides.items[qid];
      if (!sr_isObject(item)) {
        delete store.overrides.items[qid];
        migrated = true;
        continue;
      }
      if (!Array.isArray(item.answer) || item.answer.length === 0) item.answer = null;
      item.tags = null;
      if (item.difficulty !== 1 && item.difficulty !== 2 && item.difficulty !== 3) item.difficulty = null;
      item.flagged = item.flagged === true;
      if (typeof item.note !== "string") item.note = "";
      if (!Number.isInteger(item.rev) || item.rev < 1) {
        item.rev = 1;
        migrated = true;
      }
      if (typeof item.updatedAt !== "string") item.updatedAt = tm_isoNow();
      if (typeof item.updatedBy !== "string") item.updatedBy = "";
    }
    if (typeof raw.overrides.schemaVersion !== "string") migrated = true;
  } else {
    migrated = true;
  }

  store.sessions = Array.isArray(raw.sessions) ? raw.sessions.filter((s) => sr_isObject(s)) : [];
  if (!Array.isArray(raw.sessions)) migrated = true;
  store.imports = Array.isArray(raw.imports) ? raw.imports.filter((s) => sr_isObject(s)) : [];
  if (!Array.isArray(raw.imports)) migrated = true;

  return { store, migrated };
}

let sr_memory = null;

// CQP.getStore()
function sr_getStore() {
  if (sr_memory === null) sr_memory = sr_emptyStore();
  return sr_memory;
}

// CQP.setStore(store)
function sr_setStore(store) {
  if (!store || typeof store !== "object") throw new TypeError("setStore(store): store must be an object");
  sr_memory = store;
  return sr_memory;
}

function sr_resetMemoryStore() {
  sr_memory = null;
}

function sr_clone(value) {
  return value === null || value === undefined ? value : JSON.parse(JSON.stringify(value));
}

// 追加作答记录（同 recordKey 视为同一事实，跳过重复）
function sr_appendRecord(store, record) {
  const key = rc_recordKey(record);
  const exists = store.records.some((r) => {
    try {
      return rc_recordKey(r) === key;
    } catch (err) {
      return false;
    }
  });
  if (exists) return { store, added: false };
  store.records.push(record);
  store.records.sort((a, b) => (a.ts === b.ts ? 0 : a.ts < b.ts ? -1 : 1));
  if (store.meta) store.meta.updatedAt = record.ts;
  return { store, added: true };
}

function sr_appendSession(store, session) {
  if (!session || typeof session.sessionId !== "string") {
    throw new TypeError("appendSession(store, session): session.sessionId must be a string");
  }
  const idx = store.sessions.findIndex((s) => s && s.sessionId === session.sessionId);
  if (idx >= 0) {
    store.sessions[idx] = session;
    return { store, added: false };
  }
  store.sessions.push(session);
  return { store, added: true };
}

function sr_touchMeta(store, patch, nowISO) {
  const now = nowISO === undefined || nowISO === null ? tm_isoNow() : nowISO;
  if (!store.meta || typeof store.meta !== "object") store.meta = sr_emptyStore().meta;
  if (patch && typeof patch === "object") {
    for (const key of Object.keys(patch)) store.meta[key] = patch[key];
  }
  if (typeof store.meta.nickname === "string" && store.meta.nickname.length > 20) {
    store.meta.nickname = store.meta.nickname.slice(0, 20);
  }
  if (!store.meta.deviceId) store.meta.deviceId = sr_newDeviceId();
  if (!store.meta.createdAt) store.meta.createdAt = now;
  store.meta.appVersion = cn_VERSION;
  store.meta.schemaVersion = cn_STORE_SCHEMA_VERSION;
  store.meta.updatedAt = now;
  return store;
}

function sr_storeSize(store) {
  try {
    return JSON.stringify(store).length;
  } catch (err) {
    return 0;
  }
}

function sr_recordsOfNickname(store, nickname) {
  if (!store || !Array.isArray(store.records)) return [];
  return store.records.filter((r) => r && r.nickname === nickname);
}

function sr_isKnownType(type) {
  return cn_TYPES.indexOf(type) >= 0;
}

// ===== src/core/storage.mjs =====
// localStorage 适配（docs/需求规格.md 4.1 / 9.13）

let sg_backend = null;

function sg_setBackend(backend) {
  if (backend !== null && backend !== undefined && typeof backend.getItem !== "function") {
    throw new TypeError("setBackend(backend): backend must provide getItem/setItem/removeItem");
  }
  sg_backend = backend === undefined ? null : backend;
  return sg_backend;
}

function sg_realBackend() {
  try {
    const g = typeof globalThis !== "undefined" ? globalThis : null;
    if (g && g.localStorage) return g.localStorage;
  } catch (err) {
    return null;
  }
  return null;
}

function sg_backendFor() {
  if (sg_backend) return sg_backend;
  return sg_realBackend();
}

function sg_classifyError(err) {
  const name = err && err.name ? String(err.name) : "";
  const message = err && err.message ? String(err.message) : "";
  const code = err && typeof err.code === "number" ? err.code : 0;
  if (/quota/i.test(name) || /quota/i.test(message) || code === 22 || code === 1014) {
    return { code: "E_QUOTA", message: "本地存储已满（配额超限），请导出备份后清理数据" };
  }
  return { code: "E_DENIED", message: "本地存储不可用，数据无法保存，请立即导出备份" };
}

function sg_storeError(code, message, extra) {
  const err = new Error(message);
  err.code = code;
  if (extra) err.detail = extra;
  return err;
}

function sg_readKey(backend, key) {
  let text;
  try {
    text = backend.getItem(key);
  } catch (err) {
    throw sg_storeError("E_STORE_PARSE", "读取本地存储失败：" + key);
  }
  if (text === null || text === undefined || text === "") return undefined;
  try {
    return JSON.parse(text);
  } catch (err) {
    throw sg_storeError("E_STORE_PARSE", "本地存储数据损坏（JSON 解析失败）：" + key, { key, raw: String(text).slice(0, 4000) });
  }
}

// CQP.storage.load()
function sg_load() {
  const backend = sg_backendFor();
  if (!backend) return sr_emptyStore();
  const raw = {
    meta: sg_readKey(backend, cn_STORAGE_KEYS.meta),
    records: sg_readKey(backend, cn_STORAGE_KEYS.records),
    wrongbook: sg_readKey(backend, cn_STORAGE_KEYS.wrongbook),
    overrides: sg_readKey(backend, cn_STORAGE_KEYS.overrides),
    sessions: sg_readKey(backend, cn_STORAGE_KEYS.sessions),
    imports: sg_readKey(backend, cn_STORAGE_KEYS.imports),
  };
  const migrated = sr_migrateStore(raw);
  if (migrated.error) {
    const message =
      migrated.error.code === "E_VERSION"
        ? "数据版本不兼容（发现 " + String((raw.meta && raw.meta.schemaVersion) || "?") + "，程序支持 1.0.0）"
        : "本地存储结构异常";
    throw sg_storeError(migrated.error.code, message);
  }
  return migrated.store;
}

// CQP.storage.save(store) -> {ok, error?}
function sg_save(store) {
  if (!store || typeof store !== "object") throw new TypeError("storage.save(store): store must be an object");
  const backend = sg_backendFor();
  const err = sg_classifyError(null);
  if (!backend) {
    return { ok: false, error: { code: "E_DENIED", message: err.message } };
  }
  const entries = [
    [cn_STORAGE_KEYS.meta, store.meta || sr_emptyStore().meta],
    [cn_STORAGE_KEYS.records, Array.isArray(store.records) ? store.records : []],
    [cn_STORAGE_KEYS.wrongbook, store.wrongbook || {}],
    [cn_STORAGE_KEYS.overrides, store.overrides || { schemaVersion: "1.0.0", items: {} }],
    [cn_STORAGE_KEYS.sessions, Array.isArray(store.sessions) ? store.sessions : []],
    [cn_STORAGE_KEYS.imports, Array.isArray(store.imports) ? store.imports : []],
  ];
  for (const [key, value] of entries) {
    try {
      backend.setItem(key, JSON.stringify(value));
    } catch (e) {
      return { ok: false, error: sg_classifyError(e) };
    }
  }
  return { ok: true };
}

// CQP.storage.reset()：仅清空 cqp.v1.* 键
function sg_reset() {
  const backend = sg_backendFor();
  if (!backend) return;
  for (const key of Object.keys(cn_STORAGE_KEYS)) {
    try {
      backend.removeItem(cn_STORAGE_KEYS[key]);
    } catch (err) {
      /* 忽略：清空失败不影响内存态 */
    }
  }
  if (typeof backend.length === "number" && typeof backend.key === "function") {
    const prefixed = [];
    for (let i = 0; i < backend.length; i += 1) {
      const key = backend.key(i);
      if (typeof key === "string" && key.indexOf(cn_STORAGE_PREFIX) === 0) prefixed.push(key);
    }
    for (const key of prefixed) {
      try {
        backend.removeItem(key);
      } catch (err) {
        /* 忽略 */
      }
    }
  }
}

// CQP.storage.probe() -> {available, mode, error?}
function sg_probe() {
  const backend = sg_backendFor();
  if (!backend) {
    return { available: false, mode: "none", error: { code: "E_DENIED", message: "本地存储不可用，数据无法保存，请立即导出备份" } };
  }
  const probeKey = cn_STORAGE_PREFIX + "probe";
  try {
    backend.setItem(probeKey, "1");
    const back = backend.getItem(probeKey);
    backend.removeItem(probeKey);
    if (back !== "1") {
      return { available: false, mode: "none", error: { code: "E_DENIED", message: "本地存储不可写，数据无法保存，请立即导出备份" } };
    }
    return { available: true, mode: sg_backend ? "memory" : "localStorage" };
  } catch (e) {
    const err = sg_classifyError(e);
    return { available: false, mode: "none", error: err };
  }
}

function sg_keys() {
  const backend = sg_backendFor();
  if (!backend) return [];
  const out = [];
  for (const key of Object.keys(cn_STORAGE_KEYS)) {
    try {
      if (backend.getItem(cn_STORAGE_KEYS[key]) !== null) out.push(cn_STORAGE_KEYS[key]);
    } catch (err) {
      /* 忽略 */
    }
  }
  return out;
}

// CQP.storage.readRaw()：原样读取 cqp.v1.* 的磁盘字符串（不解析、不抛错）。
// t41 F-03 用途：本地数据 schema 不兼容或 JSON 损坏时，界面进入只读阻断态（绝不写回），
// 两个导出入口改为直接读这里的内容做「抢救导出」，保证用户能把浏览器里的原始数据取出来。
function sg_readRaw() {
  const backend = sg_backendFor();
  const out = {};
  for (const name of Object.keys(cn_STORAGE_KEYS)) {
    const key = cn_STORAGE_KEYS[name];
    let value = null;
    try {
      value = backend && typeof backend.getItem === "function" ? backend.getItem(key) : null;
    } catch (err) {
      value = null;
    }
    out[key] = value === undefined || value === null ? null : String(value);
  }
  return out;
}

const tk_expectCounts = cn_EXPECT_COUNTS;

// 生成用于测试的合成题库（按章 × 题型 × 数量）
function tk_makeBank(spec, options) {
  const opts = options && typeof options === "object" ? options : {};
  const chapters = [];
  const questions = [];
  const seqByCell = {};
  for (const code of cn_CHAPTER_CODES) {
    const meta = cn_CHAPTERS.filter((c) => c.chapterCode === code)[0];
    const sections = [];
    for (const type of cn_TYPES) {
      const count = (spec[code] && spec[code][type]) || 0;
      if (count <= 0) continue;
      sections.push({ sectionType: type, typeName: cn_TYPE_NAMES[type], count });
      for (let i = 1; i <= count; i += 1) {
        const key = code + "|" + type;
        seqByCell[key] = (seqByCell[key] || 0) + 1;
        const seq = seqByCell[key];
        const answer =
          type === "judge" ? ["对"] : type === "blank" ? ["答案" + seq] : type === "multiple" ? ["A", "B"] : ["A"];
        const stem = "合成题 " + code + " " + type + " " + seq + "（ ）";
        questions.push({
          id: "Q-" + code + "-" + cn_TYPE_CODES[type] + "-" + String(seq).padStart(4, "0"),
          chapterCode: code,
          partCode: meta.partCode,
          partName: meta.partName,
          chapterName: meta.chapterName,
          sectionType: type,
          typeName: cn_TYPE_NAMES[type],
          responseMode:
            type === "single" || type === "multiple" ? (answer.length >= 2 ? "multiple" : "single") : type,
          seq,
          printedNo: seq,
          stem,
          options:
            type === "single" || type === "multiple"
              ? [
                  { key: "A", text: "甲" + seq },
                  { key: "B", text: "乙" + seq },
                  { key: "C", text: "丙" + seq },
                  { key: "D", text: "丁" + seq },
                ]
              : [],
          answer,
          answerStatus: "ok",
          rawAnswer: answer.join(""),
          tags: [opts.tag || "密码法"],
          difficulty: meta.partCode === "B" ? (type === "multiple" ? 2 : 1) : type === "multiple" || type === "blank" ? 3 : 2,
          sourcePage: 1,
          blankCount: type === "blank" ? 1 : 0,
          needsReview: false,
          reviewReason: null,
        });
      }
    }
    chapters.push({
      chapterCode: code,
      partCode: meta.partCode,
      partName: meta.partName,
      chapterName: meta.chapterName,
      chapterTotal: sections.reduce((sum, s) => sum + s.count, 0),
      sections,
    });
  }
  let total = 0;
  for (const q of questions) total += 1;
  return {
    schemaVersion: "1.0.0",
    bankVersion: opts.bankVersion || "fixture-1",
    generatedAt: "2026-09-16T20:00:00+08:00",
    fixture: opts.fixture === undefined ? true : opts.fixture,
    source: {
      fileName: opts.sourceFileName || "密码赛题库.pdf",
      pages: 199,
      theoryBlocks: total,
      printedQuestions: total,
      excludedCount: 12,
      excludedReason: "第三部分实操题不纳入（用户决策 D12）",
    },
    chapters,
    questions,
  };
}

      html += '<div class="split"><div class="card"><h2>三级结构</h2><div class="tree">';
      var parts = [
        { code: "B", name: "基础题" },
        { code: "P", name: "专业题" },
      ];
      for (var p = 0; p < parts.length; p += 1) {
        var part = parts[p];
        var chapters = S.bank.chapters.filter(function (chapter) { return chapter.partCode === part.code; });
        var partTotal = chapters.reduce(function (sum, chapter) { return sum + chapter.chapterTotal; }, 0);
        var partPracticed = chapters.reduce(function (sum, chapter) {
          return sum + chapter.sections.reduce(function (inner, section) {
            return inner + S.bank.questions.filter(function (q) {
              return q.chapterCode === chapter.chapterCode && q.sectionType === section.sectionType && practiced.has(q.id);
            }).length;
          }, 0);
        }, 0);
        html += '<ul><li><label class="inline"><input type="checkbox" data-act="sel-part" value="' + part.code + '"' +
          (selectedParts.indexOf(part.code) >= 0 ? " checked" : "") + "><b>" + esc(part.name) + "</b>（共 " + partTotal + " 题，已练 " + partPracticed + "）</label>";
        html += "<ul>";
        for (var c = 0; c < chapters.length; c += 1) {
          var chapter = chapters[c];
          var chapterPracticed = S.bank.questions.filter(function (q) {
            return q.chapterCode === chapter.chapterCode && practiced.has(q.id);
          }).length;
          html += '<li><label class="inline"><input type="checkbox" data-act="sel-chapter" value="' + chapter.chapterCode + '"' +
            (selectedChapters.indexOf(chapter.chapterCode) >= 0 ? " checked" : "") + "><b>" + esc(chapter.chapterName) + "</b>（" +
            chapter.chapterTotal + " 题，已练 " + chapterPracticed + "）</label><ul>";
          for (var s = 0; s < chapter.sections.length; s += 1) {
            var section = chapter.sections[s];
            var sectionPracticed = S.bank.questions.filter(function (q) {
              return q.chapterCode === chapter.chapterCode && q.sectionType === section.sectionType && practiced.has(q.id);
            }).length;
            html += "<li>" + esc(section.typeName) + '（' + section.count + " 题，已练 " + sectionPracticed + "）" +
              '<label class="inline" style="margin-left:6px"><input type="checkbox" data-act="sel-type" value="' + section.sectionType + '"' +
              (selectedTypes.indexOf(section.sectionType) >= 0 ? " checked" : "") + "> 全库" + esc(section.typeName) + "</label></li>";
          }
          html += "</ul></li>";
        }
        html += "</ul></li></ul>";
      }
      html += "</div><div class=\"muted mt8\">不勾选任何层级=全部参与；勾选「基础题/专业题」后只在该部分内出题，章节与题型与之取交集（部分内没有选中章节时=该部分全部章节）。</div></div>" +
        '<div class="card"><h2>知识点标签</h2><div class="taglist">' +
        '<button data-act="sel-tag-clear">清空标签</button>';
      var tagNames = Object.keys(S.tagCounts).sort(function (a, b) { return S.tagCounts[b] - S.tagCounts[a]; });
      for (var t = 0; t < tagNames.length; t += 1) {
        var tag = tagNames[t];
        html += '<button data-act="sel-tag" data-tag="' + esc(tag) + '" class="' + (selectedTags.indexOf(tag) >= 0 ? "on" : "") + '">' +
          esc(tag) + " " + S.tagCounts[tag] + "</button>";
      }
      html += "</div><div class=\"muted mt8\">命中任一标签即入选（OR）；已练题量按当前题库统计。</div></div></div>";
    }
    return html;
  }

  // ------------------------------------------------------------ 答题页 P2
  function startPractice(mode, questions, extra) {
    S.practice = {
      mode: mode,
      planned: questions.length,
      questions: questions,
      idx: 0,
      items: questions.map(function () { return null; }),
      startedAt: CQP.isoNow(),
      title: extra && extra.title ? extra.title : "练习",
    };
    go("practice");
  }

  function practiceItem(index) {
    if (!S.practice.items[index]) {
      S.practice.items[index] = {
        submitted: false,
        committed: false,
        skipped: false,
        myAnswer: [],
        correct: false,
        confidence: "confident",
        color: null,
        elapsedMs: 0,
        enteredAt: Date.now(),
        record: null,
        wrongAction: null,
        bookHadEntry: false,
        bookBefore: null,
        bookWritten: false,
        bookAfter: null,
      };
    }
    return S.practice.items[index];
  }

  // 填空作答控件：作为 control 传入，由 fillStemHtml 决定放在题干里还是题干下
  function blankControlHtml(item) {
    return '<input class="blank-input" type="text" id="blankInput" data-act="blank-input" value="' +
      esc(item.myAnswer.length ? item.myAnswer[0] : "") + '"' + (item.submitted ? " disabled" : "") + ' placeholder="请输入答案">';
  }

  // 两条冻结分支：① 题干有下划线标记 → 原位替换；② 无标记 → 末尾标点前插入（无末尾标点则追加）
  function fillStemHtml(question, control) {
    var stem = esc(question.stem);
    if (CQP.responseModeOf(question) !== "blank" || !control) return stem;
    var marker = /[_＿]{2,}|_[ \u3000]_/;
    if (marker.test(stem)) return stem.replace(marker, control);
    var withControl = stem.replace(/([。．.？?！!：:；;])\s*$/, control + "$1");
    return withControl === stem ? stem + control : withControl;
  }

  function renderPractice() {
    var P = S.practice;
    if (!P) { return renderSetup(); }
    if (P.idx >= P.questions.length) return renderResult();
    var question = P.questions[P.idx];
    var item = practiceItem(P.idx);
    var mode = CQP.responseModeOf(question);
    var flagged = CQP.isFlagged(S.store.overrides, question.id);
    var answeredCount = P.items.filter(function (entry) { return entry && entry.submitted; }).length;

    var optionsHtml = "";
    var stemControl = "";
    if (mode === "blank") {
      stemControl = blankControlHtml(item);
      optionsHtml = '<div class="row"><span class="muted">忽略大小写与首尾空格（全角字符按半角判分）；一题多答案请在「校对纠错」中补录</span></div>';
    } else {
      var values = mode === "judge" ? ["对", "错"] : question.options.map(function (option) { return option.key; });
      if (values.length === 0) {
        optionsHtml = '<div class="result-box red">本题选项缺失（题库数据异常），无法作答：请直接「跳过」，或在「校对纠错」中处理。</div>';
      }
      for (var i = 0; i < values.length; i += 1) {
        var value = values[i];
        var text = mode === "judge" ? (value === "对" ? "对（正确）" : "错（错误）") : (question.options[i] ? question.options[i].text : "");
        var checked = item.myAnswer.indexOf(value) >= 0 ? " checked" : "";
        var cls = "option";
        if (item.submitted) {
          var answerList = question.answer || [];
          var isAnswer = answerList.indexOf(value) >= 0;
          var picked = item.myAnswer.indexOf(value) >= 0;
          if (isAnswer) cls += " correct";
          else if (picked) cls += " wrong";
        } else if (checked) {
          cls += " selected";
        }
        var type = mode === "multiple" ? "checkbox" : "radio";
        optionsHtml += '<label class="' + cls + '"><input type="' + type + '" name="opt" value="' + esc(value) + '" data-act="opt"' +
          (checked ? " checked" : "") + (item.submitted ? " disabled" : "") + '><span class="key">' + esc(mode === "judge" ? (value === "对" ? "√" : "×") : value) + "</span><span>" + esc(text) + "</span></label>";
      }
    }

    var resultHtml = "";
    if (item.submitted) {
      var hint = item.color === "green" ? "未进入错题本" : "已加入错题本";
      resultHtml = '<div class="result-box ' + item.color + '"><b>' +
        (item.correct ? "回答正确" : "回答错误") + "</b>（" + colorBadge(item.color) + "） ｜ 正确答案：<b class=\"mono\">" +
        esc(CQP.answerText(question)) + "</b> ｜ " + esc(hint) + "</div>" +
        '<div class="confbar"><span>信心标记（提交后立即选择，可回改）：</span>' +
        '<button data-act="conf" data-conf="confident" class="' + (item.confidence === "confident" ? "on" : "") + '">有把握</button>' +
        '<button data-act="conf" data-conf="guessed" class="' + (item.confidence === "guessed" ? "on" : "") + '">带猜测</button>' +
        '<span class="muted">当前：' + esc(item.confidence === "guessed" ? "带猜测" : "有把握") + " → 颜色 " + esc(item.color) + "</span>" +
        '<span class="muted">绿=有把握且对（不进错题本）；黄=猜对（进）；红=错（进）</span></div>';
    }

    return (
      '<div class="card"><div class="progress"><button data-act="prac-prev"' + (P.idx === 0 ? " disabled" : "") + ">上一题</button>" +
      "<span>第 <b>" + (P.idx + 1) + "</b> / " + P.questions.length + " 题</span>" +
      '<span class="muted">' + esc(P.title) + " ｜ 已答 " + answeredCount + " 题</span>" +
      '<span class="bar"><i style="width:' + Math.round(((P.idx + (item.submitted ? 1 : 0)) / P.questions.length) * 100) + '%"></i></span>' +
      '<button data-act="prac-skip">跳过</button>' +
      '<button data-act="prac-finish">交卷</button>' +
      '<button class="primary" data-act="prac-next">' + (P.idx === P.questions.length - 1 ? "交卷并结算" : "下一题") + "</button></div></div>" +

      '<div class="card qcard ' + (item.submitted ? item.color : "") + '">' +
      '<div class="row between"><div class="muted">' + esc(question.chapterName) + " ｜ " + esc(question.typeName) +
      (question.printedNo ? " ｜ 打印第 " + question.printedNo + " 题" : " ｜ 未编号题") +
      (question.needsReview ? ' ｜ <span class="badge flag">待校对</span>' : "") +
      (flagged ? ' ｜ <span class="badge flag">已标疑问</span>' : "") + "</div>" +
      '<div class="row">' + (question.tags || []).map(function (tag) { return '<span class="badge gray">' + esc(tag) + "</span>"; }).join("") + "</div></div>" +
      '<div class="stem">' + fillStemHtml(question, stemControl) + "</div>" +
      optionsHtml +
      resultHtml +
      '<div class="row mt12">' +
      (item.submitted ? "" : '<button class="primary" data-act="prac-submit">提交</button>') +
      '<button data-act="flag-toggle" data-qid="' + esc(question.id) + '">' + (flagged ? "取消标疑问" : "标疑问") + "</button>" +
      '<button data-act="review-q" data-qid="' + esc(question.id) + '">去校对改答案</button>' +
      "</div></div>"
    );
  }

  function renderResult() {
    var P = S.practice;
    if (!P) return renderSetup();
    var score = CQP.practiceScore(practiceRecords(), { plannedCount: P.planned });
    var rows = [];
    for (var i = 0; i < P.questions.length; i += 1) {
      var item = P.items[i];
      var question = P.questions[i];
      if (!item || !item.submitted) {
        rows.push('<tr><td>' + (i + 1) + '</td><td><span class="badge gray">未作答</span></td><td colspan="3">' + esc(trim(question.stem, 70)) + "</td></tr>");
        continue;
      }
      rows.push(
        "<tr><td>" + (i + 1) + '</td><td><span class="badge ' + item.color + '">' +
          (item.color === "green" ? "绿·有把握对" : item.color === "yellow" ? "黄·猜对" : "红·错") + "</span></td>" +
          "<td>" + esc(trim(question.stem, 70)) + "</td>" +
          '<td class="mono">' + esc(item.myAnswer.join("") || "（空）") + "</td>" +
          '<td class="mono">' + esc(CQP.answerText(question)) + "</td>" +
          '<td class="muted">' + (item.wrongAction === "added" ? "已进错题本" : item.wrongAction === "removed" ? "已自动移出" : "未进错题本") + "</td></tr>"
      );
    }
    return (
      '<div class="card"><h1>本轮结算</h1>' +
      '<div class="kv"><div class="item"><div class="k">得分</div><div class="v">' + score.correct + " / " + score.total + "</div></div>" +
      '<div class="item"><div class="k">正确率</div><div class="v small">' + (score.accuracy === null ? "—" : score.accuracy.toFixed(1) + "%") + "</div></div>" +
      '<div class="item"><div class="k">未作答</div><div class="v">' + score.unanswered + "</div></div>" +
      '<div class="item"><div class="k">模式</div><div class="v small">' + esc(CQP.MODE_NAMES[P.mode] || P.mode) + "</div></div></div>" +
      '<div class="row mt12"><button class="primary" data-act="go" data-page="wrongbook">去错题本</button>' +
      '<button data-act="prac-again">再来一轮</button>' +
      '<button data-act="go" data-page="setup">重新设置分类</button>' +
      '<button data-act="go" data-page="stats">查看学习统计</button></div></div>' +
      '<div class="card"><h2>逐题明细（三色）</h2><div class="legend"><span><i class="green"></i>有把握答对（不进错题本）</span>' +
      '<span><i class="yellow"></i>猜对（进错题本）</span><span><i class="red"></i>答错（进错题本）</span></div>' +
      '<div class="table-wrap mt8"><table><thead><tr><th>#</th><th>颜色</th><th>题干</th><th>你的答案</th><th>正确答案</th><th>错题本</th></tr></thead><tbody>' +
      rows.join("") + "</tbody></table></div></div>"
    );
  }

  // ------------------------------------------------------------ 提交与判分
  function readAnswerFromDom(question) {
    var mode = CQP.responseModeOf(question);
    if (mode === "blank") {
      var input = $("blankInput");
      var text = input ? input.value : "";
      return text.trim().length === 0 && text.length === 0 ? [] : [text];
    }
    var picked = [];
    var nodes = document.querySelectorAll('input[name="opt"]:checked');
    for (var i = 0; i < nodes.length; i += 1) picked.push(nodes[i].value);
    return picked;
  }

  // 提交即落库：记录在点「提交」时马写入 store（同 recordKey 幂等更新），
  // 因此答完直接点导航/刷新/关页面也不会丢作答记录与错题本条目（t4 O-2）。
  function upsertRecord(store, record) {
    for (var i = 0; i < store.records.length; i += 1) {
      var existing = store.records[i];
      if (existing && existing.recordKey === record.recordKey) {
        store.records[i] = record;
        return "updated";
      }
    }
    store.records.push(record);
    store.records.sort(function (a, b) { return a.ts === b.ts ? 0 : a.ts < b.ts ? -1 : 1; });
    return "added";
  }

  function cloneBookEntry(entry) {
    return entry === null || entry === undefined ? null : JSON.parse(JSON.stringify(entry));
  }

  function bookEntryOf(qid) {
    return Object.prototype.hasOwnProperty.call(S.store.wrongbook, qid) ? S.store.wrongbook[qid] : null;
  }

  function sameBookEntry(a, b) {
    return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b);
  }

  // 条目是否算「在册」：removed（手动移出 / 连续有把握自动移出）一律视为不在册
  function bookEntryCountsAsInBook(entry) {
    return entry !== null && entry !== undefined && entry.state !== "removed";
  }

  // 改信心后按最新颜色重算错题本：先恢复「本题当前基线」，再按 8.3 规则重新应用。
  // t16 F-01 安全阀：回放前校验当前条目是否仍停在我们的基线上；若用户此后显式改过
  // （手动移出 / 连续有把握自动移出 / 导入等），本次**不回放**，只把基线重置为当前状态，
  // **绝不用提交时的旧快照覆盖用户操作**。
  function refreshItemBookBaseline(item, qid) {
    var current = bookEntryOf(qid);
    var onBaseline = sameBookEntry(current, item.bookBefore);
    var onLastWrite = item.bookWritten === true && sameBookEntry(current, item.bookAfter);
    if (!onBaseline && !onLastWrite) {
      item.bookBefore = cloneBookEntry(current);
      item.bookHadEntry = current !== null;
      item.bookWritten = true;
      item.bookAfter = cloneBookEntry(current);
      return false;
    }
    return true;
  }

  function applyItemBook(item, record) {
    var qid = record.qid;
    if (!refreshItemBookBaseline(item, qid)) return null; // 条目已被用户显式改动 → 不回放
    if (item.bookHadEntry) S.store.wrongbook[qid] = cloneBookEntry(item.bookBefore);
    else delete S.store.wrongbook[qid];
    // t24 F-01b：基线（回放起点）里该条目已经是 removed，且我们此前已为这次作答写过记录
    // （bookWritten=true，即本次是对同一条历史记录的再次回放）→ **只恢复状态、跳过 8.3 重放**，
    // 否则「removed + 判错 → 重新进入」会把用户手动移出的题复活。
    // 注意 bookWritten=false（本题全新提交）时不跳过：新一次作答照常按 8.3 入册。
    var baselineRemoved = item.bookWritten === true && item.bookBefore !== null && item.bookBefore.state === "removed";
    var action = null;
    if (!baselineRemoved) {
      var applied = CQP.wrongbookApply(S.store.wrongbook, record, record.ts);
      S.store.wrongbook = applied.book;
      action = applied.action;
    }
    item.bookWritten = true;
    item.bookAfter = cloneBookEntry(bookEntryOf(qid));
    return action;
  }

  // opts: {skipPersist, skipBook}；skipBook=true 时只落库记录、绝不触碰错题本（卸载兜底用）
  function writeItemRecord(index, opts) {
    var options = opts && typeof opts === "object" ? opts : { skipPersist: opts === true, skipBook: false };
    var P = S.practice;
    var item = P && P.items[index];
    if (!item || !item.submitted) return null;
    var record = CQP.makeRecord({
      question: P.questions[index],
      myAnswer: item.myAnswer,
      confidence: item.confidence,
      elapsedMs: item.elapsedMs,
      mode: P.mode,
      nickname: nick(),
      bankVersion: bankVersion(),
      appVersion: CQP.VERSION,
      sessionId: null,
      nowISO: item.ts,
    });
    upsertRecord(S.store, record);
    item.record = record;
    if (P.mode !== "mock" && !options.skipBook) {
      var action = applyItemBook(item, record);
      if (action !== null) item.wrongAction = action;
    }
    if (!options.skipPersist) persist();
    return record;
  }

  function practiceRecords() {
    var P = S.practice;
    var out = [];
    if (!P) return out;
    for (var i = 0; i < P.items.length; i += 1) {
      if (P.items[i] && P.items[i].record) out.push(P.items[i].record);
    }
    return out;
  }

  function submitCurrent() {
    var P = S.practice;
    var question = P.questions[P.idx];
    var item = practiceItem(P.idx);
    if (item.submitted) return;
    var myAnswer = readAnswerFromDom(question);
    if (myAnswer.length === 0 || (myAnswer.length === 1 && myAnswer[0] === "")) {
      toast("请先作答，或点击「跳过」");
      return;
    }
    var verdict = CQP.judge(question, myAnswer);
    item.myAnswer = myAnswer;
    item.correct = verdict.correct;
    item.confidence = "confident";
    item.color = CQP.color({ correct: verdict.correct, confidence: item.confidence });
    item.elapsedMs = Math.max(0, Date.now() - item.enteredAt);
    item.ts = CQP.isoNow();
    item.submitted = true;
    item.bookHadEntry = Object.prototype.hasOwnProperty.call(S.store.wrongbook, question.id);
    item.bookBefore = item.bookHadEntry ? cloneBookEntry(S.store.wrongbook[question.id]) : null;
    item.bookWritten = false;
    item.bookAfter = null;
    writeItemRecord(P.idx);
    render();
  }

  function setConfidence(conf) {
    var item = practiceItem(S.practice.idx);
    if (!item.submitted) return;
    item.confidence = conf;
    item.color = CQP.color({ correct: item.correct, confidence: conf });
    writeItemRecord(S.practice.idx);
    render();
  }

  // 离开本题时只做一次幂等同步（记录已在提交时落库）
  function commitItem(index) {
    var P = S.practice;
    var item = P && P.items[index];
    if (!item || !item.submitted) return;
    writeItemRecord(index);
  }

  // beforeunload / pagehide 兜底：把已提交题目与进行中模拟赛的作答落库。
  // t16 F-01：兜底**只做记录落库**，不再回放错题本快照 —— 否则会用提交时的旧快照
  // 覆盖用户之后的手动移出（state=removed/manual）等显式操作。
  function flushPractice() {
    var P = S.practice;
    if (P) {
      for (var i = 0; i < P.items.length; i += 1) {
        if (P.items[i] && P.items[i].submitted) writeItemRecord(i, { skipPersist: true, skipBook: true });
      }
    }
    if (S.mock && S.mock.phase === "running" && S.mock.paper) {
      var current = S.mock.paper.questionIds[S.mock.idx];
      if (S.mock.responses[current]) {
        S.mock.responses[current].elapsedMs += Math.max(0, Date.now() - S.mock.enteredAt);
      }
      flushMockRecords(null);
    }
    try {
      persist();
    } catch (err) {
      /* 卸载阶段尽力而为 */
    }
  }

  function nextQuestion() {
    var P = S.practice;
    commitItem(P.idx);
    if (P.idx >= P.questions.length - 1) {
      S.practice = P;
      S.page = "result";
      render();
      return;
    }
    P.idx += 1;
    render();
  }

  function skipQuestion() {
    var P = S.practice;
    var item = practiceItem(P.idx);
    if (!item.submitted) item.skipped = true;
    if (P.idx >= P.questions.length - 1) {
      S.page = "result";
      render();
      return;
    }
    P.idx += 1;
    render();
  }

  function finishPractice() {
    var P = S.practice;
    var item = P.items[P.idx];
    if (item && item.submitted) commitItem(P.idx);
    confirmBox("确认交卷？", "<p>未提交的题将记为「未作答」；已提交题目的作答记录在提交时就已保存。</p>", function () {
      S.page = "result";
      render();
    }, "交卷");
  }

  function prevQuestion() {
    var P = S.practice;
    if (P.idx > 0) { P.idx -= 1; render(); }
  }

  // ------------------------------------------------------------ 错题本 P4
  function renderWrongbook() {

  function statsScope() {
    return { scope: S.statsRange.scope, from: S.statsRange.from, to: S.statsRange.to };
  }

  // 列排序：空值恒排最后；字符串按码点，数值按大小，dir 为 asc/desc
  function sortRows(rows, sort) {
    var list = rows.slice();
    var dir = sort && sort.dir === "asc" ? 1 : -1;
    var key = sort && sort.key ? sort.key : null;
    if (!key) return list;
    list.sort(function (a, b) {
      var x = a[key];
      var y = b[key];
      var xNull = x === null || x === undefined;
      var yNull = y === null || y === undefined;
      if (xNull && yNull) return 0;
      if (xNull) return 1;
      if (yNull) return -1;
      if (typeof x === "string" || typeof y === "string") {
        var sx = String(x);
        var sy = String(y);
        if (sx === sy) return 0;
        return sx < sy ? -dir : dir;
      }
      if (x === y) return 0;
      return x < y ? -dir : dir;
    });
    return list;
  }

  function sortHeader(table, key, label, numeric) {
    var sort = S.statsSort[table] || {};
    var mark = sort.key === key ? (sort.dir === "asc" ? " ▲" : " ▼") : "";
    return (
      '<th class="' + (numeric ? "num " : "") + '" style="cursor:pointer" data-act="stats-sort" data-table="' + table +
      '" data-key="' + key + '" title="点击切换排序">' + esc(label) + mark + "</th>"
    );
  }

  function renderStats() {
    var range = S.statsRange;
    var all = S.store.records;
    var nicknames = Array.from(new Set(all.map(function (record) { return record.nickname; }))).sort(CQP.compareNickname);
    if (!S.statsNick || nicknames.indexOf(S.statsNick) < 0) S.statsNick = nicknames.indexOf(nick()) >= 0 ? nick() : nicknames[0] || nick();
    var targetNick = S.statsNick;

    var scoped = [];
    var rangeError = "";
    try {
      scoped = CQP.filterByDate(all, range.scope === "all" ? { scope: "all" } : range);
    } catch (err) {
      scoped = all;
      // 只呈现冻结文案，不暴露内部异常消息
      rangeError = err instanceof RangeError ? RANGE_TEXT : "日期不合法，已按全部记录统计";
    }
    var mine = scoped.filter(function (record) { return record.nickname === targetNick; });
    var stats = CQP.personalStats({ records: all, questions: S.bank.questions, nickname: targetNick, sessions: S.store.sessions });
    var scopedStats = CQP.personalStats({ records: scoped, questions: S.bank.questions, nickname: targetNick, sessions: S.store.sessions });
    var overall = CQP.masteryOverall(mine);
    var byType = CQP.groupSummary(mine, S.bank.questions, function (q) { return q.sectionType; });
    var byChapter = CQP.groupSummary(mine, S.bank.questions, function (q) { return q.chapterCode; });

    // 每题明细
    var perQuestion = [];
    var byQid = new Map();
    for (var i = 0; i < mine.length; i += 1) {
      var list = byQid.get(mine[i].qid);
      if (!list) { list = []; byQid.set(mine[i].qid, list); }
      list.push(mine[i]);
    }
    byQid.forEach(function (list, qid) {
      var question = S.qById.get(qid);
      if (!question) return;
      var m = CQP.masteryOfAttempts(list);
      var rec = CQP.statsOfRecords(list);
      perQuestion.push({
        qid: qid,
        question: question,
        chapterName: question.chapterName,
        typeName: question.typeName,
        stem: question.stem,
        attempts: m.attempts,
        correct: m.confidentCorrect + m.guessedCorrect,
        confidentCorrect: m.confidentCorrect,
        wrong: m.wrong,
        guessed: m.guessedCorrect,
        index: m.index,
        insufficient: m.insufficient,
        lastTs: rec.lastTs,
      });
    });

    // 总览与明细表列排序（点击表头切换）
    var chapterRows = S.bank.chapters.map(function (chapter) {
      var row = byChapter[chapter.chapterCode] || { answered: 0, accuracy: null, mastery: { index: null, insufficient: true }, correct: 0 };
      return {
        chapterCode: chapter.chapterCode,
        chapterName: chapter.chapterName,
        chapterTotal: chapter.chapterTotal,
        answered: row.answered,
        accuracy: row.accuracy,
        masteryIndex: row.mastery.index,
        masteryInsufficient: row.mastery.insufficient,
      };
    });
    var typeRows = CQP.TYPES.map(function (type) {
      var row = byType[type] || { answered: 0, accuracy: null, mastery: { index: null, insufficient: true } };
      return {
        type: type,
        typeName: CQP.TYPE_NAMES[type],
        order: CQP.TYPES.indexOf(type),
        answered: row.answered,
        accuracy: row.accuracy,
        masteryIndex: row.mastery.index,
        masteryInsufficient: row.mastery.insufficient,
      };
    });
    chapterRows = sortRows(chapterRows, S.statsSort.chapter);
    typeRows = sortRows(typeRows, S.statsSort.type);
    var sortedPerQuestion = sortRows(perQuestion, S.statsSort.detail);
    var detailRows = sortedPerQuestion.slice(0, S.detailLimit).map(function (row) {
      return "<tr><td class=\"mono\">" + esc(row.qid) + "</td><td>" + esc(row.chapterName) + "</td><td>" + esc(row.typeName) + "</td>" +
        "<td>" + esc(trim(row.stem, 60)) + "</td>" +
        '<td class="num">' + row.attempts + "</td><td class=\"num\">" + row.correct + "</td><td class=\"num\">" + row.confidentCorrect +
        "</td><td class=\"num\">" + row.wrong + "</td><td class=\"num\">" + row.guessed + "</td>" +
        '<td class="num">' + masteryText(row.index, row.insufficient) + "</td></tr>";
    });

    // 薄弱 TOP：按知识点分组正确率
    var tagStats = [];
    Object.keys(S.tagIndex).forEach(function (tag) {
      var ids = S.tagIndex[tag];
      var idSet = new Set(ids);
      var list = mine.filter(function (record) { return idSet.has(record.qid); });
      if (list.length === 0) return;
      var correct = list.filter(function (record) { return record.correct; }).length;
      var m = CQP.masteryOfAttempts(list);
      tagStats.push({ tag: tag, total: ids.length, attempts: list.length, accuracy: (correct / list.length) * 100, index: m.index, insufficient: m.insufficient });
    });
    tagStats.sort(function (a, b) { return a.accuracy === b.accuracy ? b.attempts - a.attempts : a.accuracy - b.accuracy; });
    var weakestTags = tagStats.filter(function (row) { return row.attempts >= 3; }).slice(0, 10);
    var weakestQuestions = perQuestion.filter(function (row) { return row.attempts >= 3 && row.index !== null; }).sort(function (a, b) { return a.index - b.index; }).slice(0, 10);

      '<label class="inline"><input type="radio" name="scope" data-act="stats-scope" value="range"' + (range.scope === "range" ? " checked" : "") + "> 区间</label>" +

      '<button class="primary" data-act="go" data-page="io">去导出 / 导入</button>' +
      (rangeError ? '<span class="badge red">' + esc(rangeError) + "</span>" : "") +
      '<span class="muted">日期口径＝本地自然日；掌握指数＝(有把握对×1＋猜对×0.5＋错×0)÷作答次数×100，样本&lt;3 显示样本不足；点击表头可排序。</span></div>' +
      '<div class="kv mt12">' +
      '<div class="item"><div class="k">范围内作答</div><div class="v">' + mine.length + "</div></div>" +
      '<div class="item"><div class="k">范围内正确</div><div class="v">' + (scopedStats.nickname === targetNick ? scopedStats.correct : mine.filter(function (r) { return r.correct; }).length) + "</div></div>" +

      '<div class="item"><div class="k">范围内掌握指数</div><div class="v small">' + masteryText(overall.index, overall.insufficient) + "</div></div>" +
      '<div class="item"><div class="k">累计作答</div><div class="v">' + stats.answered + "</div></div>" +
      '<div class="item"><div class="k">累计正确率</div><div class="v small">' + (stats.accuracy === null ? "—" : stats.accuracy.toFixed(1) + "%") + "</div></div>" +
      '<div class="item"><div class="k">累计掌握指数</div><div class="v small">' + masteryText(stats.mastery.index, stats.mastery.insufficient) + "</div></div>" +
      '<div class="item"><div class="k">个人易错题</div><div class="v">' + stats.wrongQuestionCount + "</div></div>" +

      chapterRows.map(function (row) {
        return "<tr><td>" + esc(row.chapterName) + "</td><td class=\"num\">" + row.chapterTotal + "</td><td class=\"num\">" + row.answered +
          "</td><td class=\"num\">" + (row.accuracy === null ? "—" : row.accuracy.toFixed(1) + "%") + "</td><td class=\"num\">" +
          masteryText(row.masteryIndex, row.masteryInsufficient) + "</td></tr>";

        '<div class="item"><div class="k">磁盘上的模拟赛</div><div class="v small">' + snapshot.counts.sessions + " 场</div></div>" +

    var reportHtml = "";

        " 条）；模拟赛 " + report.sessionsImported + " 场；涉及昵称：" + esc(report.nicknames.join("、") || "—") +
        (report.unknownQids.length ? "；未知题号 " + report.unknownQids.length + " 条（未入库）" : "");
      reportHtml = report.importedRecords === 0
        ? '<div class="result-box yellow mt12"><b>' + IMPORT_NO_NEW_PREFIX + duplicateTotal + " 条为重复记录（未重复计数）</b><br>" + detailText + "</div>"
        : '<div class="result-box green mt12"><b>导入完成</b>：新增 ' + report.importedRecords + " 条，重复 " + duplicateTotal + " 条，" + detailText + "</div>";
    } else if (io.pending) {
      var pending = io.pending;
      reportHtml = '<div class="result-box ' + (pending.ok ? "green" : "red") + ' mt12">' +
        (pending.ok
          ? "<b>文件校验通过</b>：共 " + pending.payload.counts.records + " 条作答记录、" + pending.payload.counts.sessions + " 场模拟赛、" + pending.payload.counts.overrides + " 条纠错覆盖；导出人 " + esc(pending.payload.exportedBy.nickname) + "。"
          : "<b>文件无法导入</b>：" + esc(pending.errors.map(function (e) { return e.code + " " + e.message; }).join("；"))) +
        "</div>" +
        (pending.ok
          ? '<div class="row mt8"><button class="primary" data-act="import-confirm">确认合并</button><button data-act="import-cancel">取消</button></div>'
          : "");
    }

    var ledger = S.store.imports.slice().reverse().slice(0, 30).map(function (item) {
      return "<tr><td>" + esc(item.fileName) + "</td><td>" + esc(item.importedAt) + "</td><td>" + esc((item.nicknames || []).join("、")) +
        '</td><td class="num">' + item.importedRecords + '</td><td class="num">' + item.duplicates + '</td><td class="num">' + item.skipped + "</td></tr>";
    });

    return (
      '<div class="card"><h1>导出 / 导入</h1>' +
